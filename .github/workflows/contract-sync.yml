name: contract-sync
on:
  push:
    paths: ['contract/**']
  pull_request:
    paths: ['contract/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run validate:contracts
