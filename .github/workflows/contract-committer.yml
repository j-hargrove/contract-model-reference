name: contract-committer
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['contract/**']
jobs:
  update-component:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - name: Save contract diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.merge_commit_sha }} -- contract/ > /tmp/contract.diff
      - run: git checkout -b contract-sync/${{ github.event.pull_request.merge_commit_sha }}
      - name: Run claude -p
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat <<'PROMPT'
          A file under /contract changed on main. The diff is saved at /tmp/contract.diff.

          1. Read /tmp/contract.diff, then read contract/tokens.json and contract/contracts.json in full.
          2. For every component declared in contracts.json, make src/components/<Name>.tsx match
             it exactly: correct variants, states, props, and literal token values copied from
             tokens.json (components embed token values as literals; they do not import
             contract/tokens.json at runtime).
          3. If an entry has a "composition" field, its component file must import exactly the
             named sub-components, via the named prop, in the described role, and nothing else
             - do not invent composition relationships not present in the contract.
          4. If a token change affects a token referenced by more than one component's "tokens"
             list, update every affected file, not just the first one touched.
          5. If contracts.json declares a component with no existing file, create it following the
             pattern in src/components/Button.tsx, and register it in src/app/kitchen-sink/page.tsx.
          6. Only touch files under src/components/ and src/app/kitchen-sink/. Do not modify
             anything under contract/.
          7. Keep changes minimal: no new dependencies, no unrequested props, no speculative
             abstraction, no comments beyond what's needed to note the token source.
          8. Write /tmp/pr-summary.md accounting for the PR honestly, since it may end up
             describing unrelated pre-existing drift rather than a real response to the diff
             that triggered this run:
             - List each token that actually changed in /tmp/contract.diff. For each one, say
               whether it's referenced by any component's "tokens" list in contracts.json. If it
               is, describe what you changed in response. If it is NOT referenced anywhere, say so
               explicitly (e.g. "No change needed for the triggering edit: spacing.xs is not
               referenced by any component.") - do not imply you responded to it if you didn't.
             - Separately, list any OTHER literal-value mismatch you found and fixed while
               reconciling components against tokens.json that is NOT one of the tokens that
               changed in /tmp/contract.diff (pre-existing drift). For each, name the stale
               literal, the current tokens.json value, and that it predates this change.
             - If you made no file changes at all, still write this file explaining why.

          Apply edits directly.
          PROMPT
          )" \
            --allowedTools "Read,Edit,Write,Bash" \
            --permission-mode acceptEdits
      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add src/
          if git diff --cached --quiet; then
            echo "No component changes generated by claude -p; nothing to open a PR for."
            exit 0
          fi
          git config user.name "claude-committer[bot]"
          git config user.email "claude-committer@users.noreply.github.com"
          git commit -m "Sync components with contract change ${{ github.event.pull_request.merge_commit_sha }} (from #${{ github.event.pull_request.number }})"
          git push origin HEAD:contract-sync/${{ github.event.pull_request.merge_commit_sha }}
          {
            echo "Automated by claude -p, run after #${{ github.event.pull_request.number }} merged (${{ github.event.pull_request.merge_commit_sha }}). This PR may not be a direct response to that change - see the accounting below."
            echo
            cat /tmp/pr-summary.md
            echo
            echo "Review before merging."
          } > /tmp/pr-body.md
          gh pr create \
            --title "Sync components with contract change ${{ github.event.pull_request.merge_commit_sha }}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head contract-sync/${{ github.event.pull_request.merge_commit_sha }}
